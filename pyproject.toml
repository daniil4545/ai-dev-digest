[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# BLE001 (flake8-blind-except) is explicitly excluded, not just unselected:
# broad except Exception blocks in collect.py isolate the failure of a single
# source so the other sources are still collected.
ignore = ["BLE001"]
